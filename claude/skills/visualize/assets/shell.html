<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel2:#f1f1ee; --ink:#1d1d1b; --ink2:#55554f; --ink3:#8a8a82;
  --line:#dedcd5; --line2:#c9c6bd;
  --c1:#0f8a7e; --c1-bg:#e3f4f1;
  --c2:#c06a12; --c2-bg:#fbeedd;
  --c3:#7046c8; --c3-bg:#efe8fb;
  --c4:#3b6fd8; --c4-bg:#e5edfb;
  --c5:#c23d7a; --c5-bg:#fbe6ef;
  --ok:#2f8f3a; --ok-bg:#e4f3e5; --warn:#c0392b; --warn-bg:#fbe5e2; --hold:#9a7b00; --hold-bg:#f8f0cc;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --panel:#1d1d1b; --panel2:#262623; --ink:#ecebe6; --ink2:#b4b2aa; --ink3:#7d7b74;
    --line:#34332f; --line2:#46453f;
    --c1:#3cc4b4; --c1-bg:#173430; --c2:#f0a04b; --c2-bg:#3a2a17;
    --c3:#a98bf0; --c3-bg:#2a2140; --c4:#7ea3f2; --c4-bg:#1d2a44; --c5:#ee7aae; --c5-bg:#3d1d2c;
    --ok:#6cc777; --ok-bg:#1c3320; --warn:#f07b6e; --warn-bg:#3d1f1b; --hold:#e2c44f; --hold-bg:#38300f;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1d1b; --panel2:#262623; --ink:#ecebe6; --ink2:#b4b2aa; --ink3:#7d7b74;
  --line:#34332f; --line2:#46453f;
  --c1:#3cc4b4; --c1-bg:#173430; --c2:#f0a04b; --c2-bg:#3a2a17;
  --c3:#a98bf0; --c3-bg:#2a2140; --c4:#7ea3f2; --c4-bg:#1d2a44; --c5:#ee7aae; --c5-bg:#3d1d2c;
  --ok:#6cc777; --ok-bg:#1c3320; --warn:#f07b6e; --warn-bg:#3d1f1b; --hold:#e2c44f; --hold-bg:#38300f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
nav.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding:8px 16px;overflow-x:auto;white-space:nowrap}
nav.top .brand{font-weight:700;margin-right:12px;font-size:14px}
nav.top a{text-decoration:none;font-size:13px;padding:5px 10px;border-radius:999px;color:var(--ink2)}
nav.top a:hover,nav.top a.on{background:var(--panel2);color:var(--ink)}
nav.top button{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
section.sec{margin:40px 0 56px}
section.sec>h2{font-size:26px;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:center;gap:10px}
section.sec>h2 .num{font:600 13px var(--mono);color:var(--panel);background:var(--ink);border-radius:6px;padding:2px 7px}
section.sec>.lede{color:var(--ink2);margin:0 0 18px;max-width:760px}
h3.q{font-size:17px;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline}
h3.q::before{content:"";width:4px;height:1em;background:var(--ink2);border-radius:2px;flex:none;align-self:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig.wide{overflow-x:auto}
@media (max-width:640px){.fig.wide>svg{min-width:720px}}
.cap{font-size:13px;color:var(--ink2);margin-top:8px}
.src{font:12px var(--mono);color:var(--ink3);word-break:break-all}
.src::before{content:"↳ "}
code,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--panel2);padding:1px 5px;border-radius:4px}
.chip{display:inline-block;font:600 11px var(--mono);padding:2px 8px;border-radius:999px;border:1px solid currentColor;vertical-align:middle;white-space:nowrap}
.chip.c1{color:var(--c1);background:var(--c1-bg)} .chip.c2{color:var(--c2);background:var(--c2-bg)}
.chip.c3{color:var(--c3);background:var(--c3-bg)} .chip.c4{color:var(--c4);background:var(--c4-bg)}
.chip.c5{color:var(--c5);background:var(--c5-bg)} .chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.hold{color:var(--hold);background:var(--hold-bg)}
.chip.est{color:var(--ink3);background:transparent;border-style:dashed}
.callout{border-left:4px solid var(--ink2);background:var(--panel2);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.callout.warn{border-color:var(--warn);background:var(--warn-bg)} .callout.ok{border-color:var(--ok);background:var(--ok-bg)}
.callout.c3{border-color:var(--c3);background:var(--c3-bg)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.tbl th{font-weight:600;color:var(--ink2);background:var(--panel2);position:sticky;top:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.btn:hover{background:var(--panel2)} .btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.muted{color:var(--ink2)} .tiny{font-size:12px}
details.qa{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:10px 0}
details.qa>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:8px}
details.qa>summary::before{content:"▸";color:var(--ink3);transition:transform .2s}
details.qa[open]>summary::before{transform:rotate(90deg)}
details.qa>.body{padding:0 16px 16px}
/* svg text defaults */
svg text{font-family:var(--sans);fill:var(--ink)}
svg .m{font-family:var(--mono)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="top">
  <span class="brand"><!--BRAND--></span>
<!--NAV-->
  <button id="themeBtn" type="button">theme</button>
</nav>
<main>
<!--SECTIONS-->
<p class="tiny muted" style="margin-top:60px"><!--FOOTER--> <span class="chip est">est.</span> = inferred or estimated, not read from the source.</p>
</main>
<script>
(function(){
  const root=document.documentElement, btn=document.getElementById('themeBtn');
  try{const t=localStorage.getItem('theme'); if(t) root.dataset.theme=t;}catch(e){}
  btn.onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}};
  const links=[...document.querySelectorAll('nav.top a')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));}}),{rootMargin:'-40% 0px -55% 0px'});
  document.querySelectorAll('section.sec').forEach(s=>io.observe(s));
})();
</script>
</body>
</html>
